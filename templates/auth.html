<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 雪球动态监控</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 360px; margin: 12vh auto;">
        <div style="padding: 28px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);">
            <h2 style="margin: 0 0 8px;">🔐 需要访问令牌</h2>
            <p style="opacity: .7; font-size: 13px; margin: 0 0 18px;">
                此看板已设置 <code>WEB_API_TOKEN</code>，请输入令牌后继续。
            </p>
            {% if error %}<p style="color: #e5534b; font-size: 13px; margin: 0 0 12px;">{{ error }}</p>{% endif %}
            <form method="post" action="/auth">
                <input type="password" name="token" required autofocus
                       placeholder="WEB_API_TOKEN"
                       style="width: 100%; box-sizing: border-box; padding: 9px 12px;
                              margin-bottom: 14px; border-radius: 6px;
                              border: 1px solid #444; background: #1a1d23; color: #e6e6e6;">
                <button type="submit" class="btn-refresh" style="width: 100%;">
                    <span class="label">进入看板</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
