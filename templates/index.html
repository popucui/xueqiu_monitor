<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪球动态监控</title>
    <meta name="description" content="雪球作者动态监控看板 — 实时追踪关注作者的最新投资观点">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="icon">📊</div>
            <span>雪球动态监控</span>
        </div>
        <div class="navbar-actions">
            <span class="last-update" id="lastUpdate">加载中...</span>
            <button class="btn-edit-authors" id="btnEditAuthors" onclick="openAuthorModal()">
                <span class="label">⚙️ 管理作者</span>
            </button>
            <button class="btn-refresh" id="btnRefresh" onclick="refreshData()">
                <span class="spinner"></span>
                <span class="label">🔄 手动刷新</span>
            </button>
        </div>
    </nav>

    <!-- 行情速报栏 -->
    <div class="price-bar" id="priceBar">
        <div class="price-bar-title">📈 早盘行情</div>
        <div class="price-cards" id="priceCards">
            <span class="price-loading">加载中...</span>
        </div>
        <button class="btn-price-refresh" title="刷新行情" onclick="refreshPrices()">↺</button>
    </div>

    <!-- 主内容 -->
    <div class="container">
        <div class="layout">
            <!-- 左侧作者面板 -->
            <aside class="authors-panel" id="authorsPanel">
                <div class="panel-title">关注作者</div>
                <div class="author-card author-card-all active" data-author="all" onclick="filterByAuthor('all', this)">
                    <div class="author-name">📋 全部动态</div>
                    <div class="author-meta">
                        <span id="totalPosts">0 条</span>
                    </div>
                </div>
            </aside>

            <!-- 右侧帖子列表 -->
            <main class="posts-area">
                <div class="posts-header">
                    <h1 class="posts-title" id="postsTitle">全部动态</h1>
                    <span class="posts-count" id="postsCount">0 条</span>
                </div>
                <div id="postsList">
                    <div class="empty-state">
                        <div class="icon">📡</div>
                        <p>正在加载数据...</p>
                    </div>
                </div>
                <div class="posts-loader" id="postsLoader"></div>
            </main>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner-lg"></div>
            <p>正在抓取雪球数据...</p>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">首次启动需要约 15 秒</p>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast"></div>

    <!-- 作者管理弹窗 -->
    <div class="modal-overlay" id="authorModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>管理关注作者</h2>
                <button class="modal-close" onclick="closeAuthorModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-section-title">当前作者</div>
                <div id="modalAuthorList"></div>
                <div class="modal-divider"></div>
                <div class="modal-section-title">添加新作者</div>
                <div class="add-author-form">
                    <input type="text" id="newAuthorId" placeholder="雪球用户 ID，如 5074386049" />
                    <input type="text" id="newAuthorName" placeholder="作者昵称，如 JackWalk" />
                    <button class="btn-add-author" onclick="addAuthor()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPosts = [];  // 当前筛选条件下已经懒加载出来的帖子
        let currentFilter = 'all';
        let dbAuthors = [];  // 来自数据库的作者列表（用于管理）
        let authorSummaryMap = {};
        let draggedAuthorId = null;
        let suppressAuthorClick = false;
        let totalAllPosts = 0;
        let currentTotalPosts = 0;
        let postsOffset = 0;
        let postsHasMore = false;
        let postsLoading = false;
        let postsRequestToken = 0;
        let postsObserver = null;
        const POSTS_PAGE_SIZE = 30;
        const COLORS = ['#f59e0b', '#06b6d4', '#10b981', '#f43f5e', '#8b5cf6', '#ec4899', '#14b8a6'];

        // XSS 防护：转义 HTML 特殊字符
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // 获取作者姓名首字
        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        // 获取作者颜色
        function getAuthorColor(name) {
            let h = 0;
            for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            return COLORS[Math.abs(h) % COLORS.length];
        }

        function updatePostsCount() {
            const countEl = document.getElementById('postsCount');
            if (postsLoading && !allPosts.length) {
                countEl.textContent = '加载中...';
                return;
            }
            if (currentTotalPosts && allPosts.length < currentTotalPosts) {
                countEl.textContent = `${allPosts.length} / ${currentTotalPosts} 条`;
                return;
            }
            countEl.textContent = `${currentTotalPosts || allPosts.length} 条`;
        }

        function renderPostsPlaceholder(text) {
            document.getElementById('postsList').innerHTML = `
                <div class="empty-state">
                    <div class="icon">📡</div>
                    <p>${escapeHtml(text)}</p>
                </div>`;
            updatePostsCount();
        }

        function renderPostsLoader(text) {
            document.getElementById('postsLoader').textContent = text || '';
        }

        // 渲染帖子列表
        function renderPosts(posts) {
            const container = document.getElementById('postsList');
            updatePostsCount();

            if (!posts.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>暂无动态</p>
                    </div>`;
                return;
            }

            container.innerHTML = posts.map((p, idx) => {
                const color = getAuthorColor(p.user_name || '');
                const initial = escapeHtml(getInitial(p.user_name));
                const title = p.title || '';
                const text = p.text || '';
                const displayText = text && text !== title ? text : '';
                // 只允许已知安全的相对路径和 https 链接，防止 javascript: 伪协议
                const rawTarget = p.target || '';
                const targetUrl = rawTarget.startsWith('http')
                    ? rawTarget
                    : (rawTarget.startsWith('/') ? `https://xueqiu.com${rawTarget}` : '');
                const safeAuthor = escapeHtml(p.user_name || '未知');
                const safeTime = escapeHtml(p.created_at_fmt || '');

                return `
                    <div class="post-card" style="animation-delay: ${idx * 0.05}s">
                        <div class="post-header">
                            <div class="post-avatar" style="background: linear-gradient(135deg, ${color}, ${color}99)">${initial}</div>
                            <div>
                                <div class="post-author">${safeAuthor}</div>
                                <div class="post-time">${targetUrl ? `<a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--text-muted);text-decoration:none;">${safeTime}</a>` : safeTime}</div>
                            </div>
                        </div>
                        ${title ? `<div class="post-title">${targetUrl ? `<a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent-cyan);text-decoration:none;">🔗 专栏 | ${formatText(title)}</a>` : formatText(title)}</div>` : ''}
                        ${displayText ? `<div class="post-text">${formatText(displayText)}${targetUrl && displayText.endsWith('...') ? `  <a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent-cyan); font-weight: 500;">阅读全文 &gt;</a>` : ''}</div>` : ''}
                        <div class="post-stats">
                            <span class="post-stat"><span class="icon">💬</span> ${p.reply_count || 0}</span>
                            <span class="post-stat"><span class="icon">🔄</span> ${p.retweet_count || 0}</span>
                            <span class="post-stat"><span class="icon">❤️</span> ${p.like_count || 0}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        function getEnrichedAuthors() {
            return dbAuthors.map(a => ({
                user_id: a.user_id,
                user_name: a.name,
                total: authorSummaryMap[a.user_id] ? authorSummaryMap[a.user_id].total : 0,
                latest_at_fmt: authorSummaryMap[a.user_id] ? authorSummaryMap[a.user_id].latest_at_fmt : '',
            }));
        }

        // 转义并高亮URL/转发
        function formatText(str) {
            const d = document.createElement('div');
            d.textContent = str; // Escape HTML securely
            let html = d.innerHTML;

            // Linkify URLs（排除末尾中文标点，加 noopener 防 tab-nabbing）
            html = html.replace(/(https?:\/\/[^\s<>"'，。、？！）\]]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

            // Handle Retweets format: [转发] @User: \n...
            if (html.includes('[转发] @')) {
                const parts = html.split(/\[转发\] @(.*?): \n/);
                if (parts.length >= 3) {
                    let formatted = parts[0];
                    for (let i = 1; i < parts.length; i += 2) {
                        const rtUser = parts[i];
                        const rtText = parts[i+1];
                        formatted += `<div class="retweet-box"><b>@${rtUser}</b>:<br>${rtText}</div>`;
                    }
                    html = formatted;
                }
            }
            return html;
        }

        // 渲染作者面板
        function renderAuthors(authors) {
            const panel = document.getElementById('authorsPanel');
            // 保留 "全部" 卡片
            const allCard = panel.querySelector('[data-author="all"]');
            allCard.classList.toggle('active', currentFilter === 'all');
            const existingCards = panel.querySelectorAll('[data-author]:not([data-author="all"])');
            existingCards.forEach(c => c.remove());

            document.getElementById('totalPosts').textContent = `${totalAllPosts} 条`;

            authors.forEach(a => {
                const color = getAuthorColor(a.user_name || '');
                const card = document.createElement('div');
                card.className = 'author-card';
                if (currentFilter === a.user_id) card.classList.add('active');
                card.dataset.author = a.user_id;
                card.draggable = true;
                card.title = '拖动调整作者顺序';
                card.onclick = function() {
                    if (suppressAuthorClick) return;
                    filterByAuthor(a.user_id, this);
                };
                card.addEventListener('dragstart', e => {
                    draggedAuthorId = a.user_id;
                    suppressAuthorClick = true;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', a.user_id);
                });
                card.addEventListener('dragover', e => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    card.classList.add('drag-over');
                });
                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');
                });
                card.addEventListener('drop', e => {
                    e.preventDefault();
                    card.classList.remove('drag-over');
                    const sourceId = e.dataTransfer.getData('text/plain') || draggedAuthorId;
                    const targetRect = card.getBoundingClientRect();
                    const placeAfter = e.clientY > targetRect.top + targetRect.height / 2;
                    reorderAuthors(sourceId, a.user_id, placeAfter);
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging', 'drag-over');
                    draggedAuthorId = null;
                    setTimeout(() => { suppressAuthorClick = false; }, 0);
                });
                // 使用 DOM API 赋值，避免 XSS
                const nameDiv = document.createElement('div');
                nameDiv.className = 'author-name';
                nameDiv.style.color = color;
                nameDiv.innerHTML = `<span class="author-drag-handle">↕</span>${escapeHtml(a.user_name || a.user_id)}`;
                const metaDiv = document.createElement('div');
                metaDiv.className = 'author-meta';
                metaDiv.innerHTML = `<span>${escapeHtml(String(a.total))} 条</span><span>${escapeHtml(a.latest_at_fmt || '')}</span>`;
                const delBtn = document.createElement('button');
                delBtn.className = 'author-del-btn';
                delBtn.title = '删除作者';
                delBtn.textContent = '✕';
                delBtn.draggable = false;
                delBtn.onclick = function(e) {
                    e.stopPropagation();
                    confirmDeleteAuthor(a.user_id, a.user_name || a.user_id);
                };
                card.appendChild(nameDiv);
                card.appendChild(metaDiv);
                card.appendChild(delBtn);
                panel.appendChild(card);
            });
        }

        async function reorderAuthors(sourceId, targetId, placeAfter) {
            if (!sourceId || !targetId || sourceId === targetId) return;
            const sourceIndex = dbAuthors.findIndex(a => a.user_id === sourceId);
            const targetIndex = dbAuthors.findIndex(a => a.user_id === targetId);
            if (sourceIndex < 0 || targetIndex < 0) return;

            const reordered = dbAuthors.slice();
            const [moved] = reordered.splice(sourceIndex, 1);
            let insertIndex = reordered.findIndex(a => a.user_id === targetId);
            if (placeAfter) insertIndex += 1;
            reordered.splice(insertIndex, 0, moved);

            dbAuthors = reordered;
            renderAuthors(getEnrichedAuthors());

            try {
                const res = await fetch('/api/authors/order', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_ids: dbAuthors.map(a => a.user_id)}),
                });
                const data = await res.json();
                if (!res.ok || data.status !== 'ok') {
                    showToast(`❌ ${data.message || '作者顺序保存失败'}`, 'error');
                    await loadData();
                    return;
                }
                showToast('✅ 作者顺序已保存', 'success');
            } catch (e) {
                showToast('❌ 作者顺序保存失败', 'error');
                await loadData();
            }
        }

        // 按作者过滤
        function filterByAuthor(authorId, el) {
            resetPosts(authorId, el);
        }

        function getAuthorName(authorId) {
            const author = dbAuthors.find(a => a.user_id === authorId);
            return author ? author.name : authorId;
        }

        async function resetPosts(authorId, el) {
            currentFilter = authorId;
            // 更新 active 状态
            document.querySelectorAll('.author-card').forEach(c => c.classList.remove('active'));
            if (el) el.classList.add('active');

            const titleEl = document.getElementById('postsTitle');
            if (authorId === 'all') {
                titleEl.textContent = '全部动态';
            } else {
                titleEl.textContent = `${getAuthorName(authorId)} 的动态`;
            }

            allPosts = [];
            currentTotalPosts = 0;
            postsOffset = 0;
            postsHasMore = true;
            postsLoading = false;
            postsRequestToken += 1;
            renderPostsLoader('');
            renderPostsPlaceholder('正在加载数据...');
            await loadMorePosts(postsRequestToken);
        }

        async function loadMorePosts(token = postsRequestToken) {
            if (postsLoading || !postsHasMore) return;
            postsLoading = true;
            updatePostsCount();
            renderPostsLoader('正在加载更多动态...');

            const params = new URLSearchParams({
                limit: String(POSTS_PAGE_SIZE),
                offset: String(postsOffset),
            });
            if (currentFilter !== 'all') {
                params.set('author_id', currentFilter);
            }

            try {
                const res = await fetch(`/api/posts?${params.toString()}`);
                const data = await res.json();
                if (token !== postsRequestToken) return;

                const newPosts = data.posts || [];
                allPosts = allPosts.concat(newPosts);
                postsOffset = data.next_offset == null ? allPosts.length : data.next_offset;
                postsHasMore = Boolean(data.has_more);
                currentTotalPosts = data.total == null ? allPosts.length : data.total;
                renderPosts(allPosts);

                if (data.last_fetch) {
                    document.getElementById('lastUpdate').textContent = `最近更新: ${data.last_fetch.replace('T', ' ').substring(0, 19)}`;
                }
                renderPostsLoader(postsHasMore ? '向下滚动加载更多' : (allPosts.length ? '已加载全部动态' : ''));
            } catch (e) {
                if (token === postsRequestToken) {
                    console.error('帖子加载失败:', e);
                    renderPostsLoader('加载失败，请稍后重试');
                }
            } finally {
                if (token === postsRequestToken) {
                    postsLoading = false;
                    updatePostsCount();
                }
            }
        }

        // 加载数据
        async function loadData() {
            try {
                const authorsRes = await fetch('/api/authors');
                const authorsData = await authorsRes.json();

                dbAuthors = authorsData.db_authors || [];
                totalAllPosts = authorsData.total_posts || 0;

                // 构建 user_id -> 统计摘要 的映射
                authorSummaryMap = {};
                (authorsData.authors || []).forEach(s => { authorSummaryMap[s.user_id] = s; });

                // 以 dbAuthors 为主（完整列表），合并统计信息
                renderAuthors(getEnrichedAuthors());

                const activeFilter = currentFilter === 'all' || dbAuthors.some(a => a.user_id === currentFilter)
                    ? currentFilter
                    : 'all';
                await resetPosts(activeFilter, document.querySelector(`[data-author="${activeFilter}"]`));
            } catch (e) {
                console.error('加载失败:', e);
            }
        }

        // 手动刷新
        async function refreshData() {
            const btn = document.getElementById('btnRefresh');
            const overlay = document.getElementById('loadingOverlay');
            btn.classList.add('loading');
            btn.disabled = true;
            overlay.classList.add('show');

            try {
                const res = await fetch('/api/refresh', { method: 'POST' });
                const data = await res.json();

                if (data.status === 'ok') {
                    showToast(`✅ 抓取完成！获取 ${data.total_fetched} 条，新增 ${data.new_posts} 条`, 'success');
                    await loadData();
                } else if (data.status === 'skipped') {
                    showToast('⏳ 上一次抓取尚未完成', 'error');
                } else {
                    showToast(`❌ ${data.message || '抓取失败'}`, 'error');
                }
            } catch (e) {
                showToast('❌ 网络错误', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
                overlay.classList.remove('show');
            }
        }

        // Toast 提示
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ===== 作者管理弹窗 =====
        function openAuthorModal() {
            renderModalAuthors();
            document.getElementById('authorModal').classList.add('show');
        }

        function closeAuthorModal() {
            document.getElementById('authorModal').classList.remove('show');
            document.getElementById('newAuthorId').value = '';
            document.getElementById('newAuthorName').value = '';
        }

        function renderModalAuthors() {
            const list = document.getElementById('modalAuthorList');
            if (!dbAuthors.length) {
                list.innerHTML = '<div class="modal-empty">暂无作者，请添加</div>';
                return;
            }

            list.innerHTML = '';
            dbAuthors.forEach(a => {
                const item = document.createElement('div');
                item.className = 'modal-author-item';

                const info = document.createElement('div');
                info.className = 'modal-author-info';

                const nameEl = document.createElement('span');
                nameEl.className = 'modal-author-name';
                nameEl.textContent = a.name || a.user_id;

                const idEl = document.createElement('span');
                idEl.className = 'modal-author-id';
                idEl.textContent = a.user_id;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-icon-danger';
                deleteBtn.title = '删除';
                deleteBtn.textContent = '✕';
                deleteBtn.addEventListener('click', () => confirmDeleteAuthor(a.user_id, a.name || a.user_id));

                info.appendChild(nameEl);
                info.appendChild(idEl);
                item.appendChild(info);
                item.appendChild(deleteBtn);
                list.appendChild(item);
            });
        }

        async function addAuthor() {
            const userId = document.getElementById('newAuthorId').value.trim();
            const name = document.getElementById('newAuthorName').value.trim();
            if (!userId || !name) {
                showToast('❌ user_id 和昵称都不能为空', 'error');
                return;
            }
            const res = await fetch('/api/authors', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, name}),
            });
            const data = await res.json();
            if (data.status === 'ok') {
                showToast(`✅ 已添加 ${name}`, 'success');
                await loadData();
                renderModalAuthors();
                document.getElementById('newAuthorId').value = '';
                document.getElementById('newAuthorName').value = '';
                // 自动刷新获取新作者动态
                showToast('📡 正在抓取新作者动态...', 'success');
                await refreshData();
            } else {
                showToast(`❌ ${data.message}`, 'error');
            }
        }

        async function deleteAuthor(userId) {
            await fetch(`/api/authors/${userId}`, {method: 'DELETE'});
            if (currentFilter === userId) currentFilter = 'all';
            showToast('✅ 已删除', 'success');
            await loadData();
            renderModalAuthors();
        }

        function confirmDeleteAuthor(userId, name) {
            if (!confirm(`确定删除「${name}」？删除后该作者的历史帖子仍会保留。`)) return;
            deleteAuthor(userId);
        }

        function setupLazyLoader() {
            const loader = document.getElementById('postsLoader');
            if ('IntersectionObserver' in window) {
                postsObserver = new IntersectionObserver(entries => {
                    if (entries.some(entry => entry.isIntersecting)) {
                        loadMorePosts();
                    }
                }, { rootMargin: '320px 0px' });
                postsObserver.observe(loader);
                return;
            }

            window.addEventListener('scroll', () => {
                const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 320;
                if (nearBottom) loadMorePosts();
            });
        }

        // 初始化
        setupLazyLoader();
        loadData();
        loadPrices();
        // 每 5 分钟自动刷新前端数据
        setInterval(loadData, 5 * 60 * 1000);
        // 每 10 分钟刷新行情
        setInterval(loadPrices, 10 * 60 * 1000);

        // ===== 行情速报 =====
        async function loadPrices() {
            try {
                const res = await fetch('/api/prices');
                const data = await res.json();
                renderPrices(data.prices || []);
            } catch(e) {
                document.getElementById('priceCards').innerHTML =
                    '<span class="price-loading">行情加载失败</span>';
            }
        }

        async function refreshPrices() {
            const btn = document.querySelector('.btn-price-refresh');
            btn.disabled = true;
            btn.textContent = '…';
            try {
                await fetch('/api/prices/refresh', {method: 'POST'});
                await loadPrices();
                showToast('✅ 行情已更新', 'success');
            } catch(e) {
                showToast('❌ 行情刷新失败', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '↺';
            }
        }

        function renderPrices(rows) {
            const container = document.getElementById('priceCards');
            if (!rows.length) {
                container.innerHTML = '<span class="price-loading">暂无行情数据，等待 8:30 推送或手动刷新</span>';
                return;
            }
            container.innerHTML = rows.map(r => {
                const pct = r.change_pct;
                const pctText = pct == null ? '—'
                    : (pct > 0 ? `▲ ${Math.abs(pct).toFixed(2)}%`
                    : pct < 0  ? `▼ ${Math.abs(pct).toFixed(2)}%`
                    :            `— 0.00%`);
                const cls = pct == null ? '' : (pct > 0 ? 'up' : pct < 0 ? 'down' : '');
                return `
                    <div class="price-card">
                        <div class="price-name">${escapeHtml(r.name)}</div>
                        <div class="price-value">${r.price != null ? r.price : '—'} <span class="price-unit">${escapeHtml(r.unit || '')}</span></div>
                        <div class="price-change ${cls}">${pctText}</div>
                    </div>`;
            }).join('');
        }
    </script>
</body>
</html>
