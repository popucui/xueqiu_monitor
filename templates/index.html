<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪球动态监控</title>
    <meta name="description" content="雪球作者动态监控看板 — 实时追踪关注作者的最新投资观点">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="icon">📊</div>
            <span>雪球动态监控</span>
        </div>
        <div class="navbar-actions">
            <span class="last-update" id="lastUpdate">加载中...</span>
            <button class="btn-edit-authors" id="btnEditAuthors" onclick="openAuthorModal()">
                <span class="label">⚙️ 管理作者</span>
            </button>
            <button class="btn-refresh" id="btnRefresh" onclick="refreshData()">
                <span class="spinner"></span>
                <span class="label">🔄 手动刷新</span>
            </button>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container">
        <div class="layout">
            <!-- 左侧作者面板 -->
            <aside class="authors-panel" id="authorsPanel">
                <div class="panel-title">关注作者</div>
                <div class="author-card author-card-all active" data-author="all" onclick="filterByAuthor('all', this)">
                    <div class="author-name">📋 全部动态</div>
                    <div class="author-meta">
                        <span id="totalPosts">0 条</span>
                    </div>
                </div>
            </aside>

            <!-- 右侧帖子列表 -->
            <main class="posts-area">
                <div class="posts-header">
                    <h1 class="posts-title" id="postsTitle">全部动态</h1>
                    <span class="posts-count" id="postsCount">0 条</span>
                </div>
                <div id="postsList">
                    <div class="empty-state">
                        <div class="icon">📡</div>
                        <p>正在加载数据...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner-lg"></div>
            <p>正在抓取雪球数据...</p>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">首次启动需要约 15 秒</p>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast"></div>

    <!-- 作者管理弹窗 -->
    <div class="modal-overlay" id="authorModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>管理关注作者</h2>
                <button class="modal-close" onclick="closeAuthorModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-section-title">当前作者</div>
                <div id="modalAuthorList"></div>
                <div class="modal-divider"></div>
                <div class="modal-section-title">添加新作者</div>
                <div class="add-author-form">
                    <input type="text" id="newAuthorId" placeholder="雪球用户 ID，如 5074386049" />
                    <input type="text" id="newAuthorName" placeholder="作者昵称，如 JackWalk" />
                    <button class="btn-add-author" onclick="addAuthor()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPosts = [];
        let currentFilter = 'all';
        let dbAuthors = [];  // 来自数据库的作者列表（用于管理）
        const COLORS = ['#f59e0b', '#06b6d4', '#10b981', '#f43f5e', '#8b5cf6', '#ec4899', '#14b8a6'];

        // XSS 防护：转义 HTML 特殊字符
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // 获取作者姓名首字
        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        // 获取作者颜色
        function getAuthorColor(name) {
            let h = 0;
            for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            return COLORS[Math.abs(h) % COLORS.length];
        }

        // 渲染帖子列表
        function renderPosts(posts) {
            const container = document.getElementById('postsList');
            const countEl = document.getElementById('postsCount');
            countEl.textContent = `${posts.length} 条`;

            if (!posts.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>暂无动态</p>
                    </div>`;
                return;
            }

            container.innerHTML = posts.map((p, idx) => {
                const color = getAuthorColor(p.user_name || '');
                const initial = escapeHtml(getInitial(p.user_name));
                const title = p.title || '';
                const text = p.text || '';
                const displayText = text && text !== title ? text : '';
                // 只允许已知安全的相对路径和 https 链接，防止 javascript: 伪协议
                const rawTarget = p.target || '';
                const targetUrl = rawTarget.startsWith('http')
                    ? rawTarget
                    : (rawTarget.startsWith('/') ? `https://xueqiu.com${rawTarget}` : '');
                const safeAuthor = escapeHtml(p.user_name || '未知');
                const safeTime = escapeHtml(p.created_at_fmt || '');

                return `
                    <div class="post-card" style="animation-delay: ${idx * 0.05}s">
                        <div class="post-header">
                            <div class="post-avatar" style="background: linear-gradient(135deg, ${color}, ${color}99)">${initial}</div>
                            <div>
                                <div class="post-author">${safeAuthor}</div>
                                <div class="post-time">${targetUrl ? `<a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--text-muted);text-decoration:none;">${safeTime}</a>` : safeTime}</div>
                            </div>
                        </div>
                        ${title ? `<div class="post-title">${targetUrl ? `<a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent-cyan);text-decoration:none;">🔗 专栏 | ${formatText(title)}</a>` : formatText(title)}</div>` : ''}
                        ${displayText ? `<div class="post-text">${formatText(displayText)}${targetUrl && displayText.endsWith('...') ? `  <a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent-cyan); font-weight: 500;">阅读全文 &gt;</a>` : ''}</div>` : ''}
                        <div class="post-stats">
                            <span class="post-stat"><span class="icon">💬</span> ${p.reply_count || 0}</span>
                            <span class="post-stat"><span class="icon">🔄</span> ${p.retweet_count || 0}</span>
                            <span class="post-stat"><span class="icon">❤️</span> ${p.like_count || 0}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        // 转义并高亮URL/转发
        function formatText(str) {
            const d = document.createElement('div');
            d.textContent = str; // Escape HTML securely
            let html = d.innerHTML;

            // Linkify URLs（排除末尾中文标点，加 noopener 防 tab-nabbing）
            html = html.replace(/(https?:\/\/[^\s<>"'，。、？！）\]]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

            // Handle Retweets format: [转发] @User: \n...
            if (html.includes('[转发] @')) {
                const parts = html.split(/\[转发\] @(.*?): \n/);
                if (parts.length >= 3) {
                    let formatted = parts[0];
                    for (let i = 1; i < parts.length; i += 2) {
                        const rtUser = parts[i];
                        const rtText = parts[i+1];
                        formatted += `<div class="retweet-box"><b>@${rtUser}</b>:<br>${rtText}</div>`;
                    }
                    html = formatted;
                }
            }
            return html;
        }

        // 渲染作者面板
        function renderAuthors(authors) {
            const panel = document.getElementById('authorsPanel');
            // 保留 "全部" 卡片
            const allCard = panel.querySelector('[data-author="all"]');
            const existingCards = panel.querySelectorAll('[data-author]:not([data-author="all"])');
            existingCards.forEach(c => c.remove());

            document.getElementById('totalPosts').textContent = `${allPosts.length} 条`;

            authors.forEach(a => {
                const color = getAuthorColor(a.user_name || '');
                const card = document.createElement('div');
                card.className = 'author-card';
                card.dataset.author = a.user_id;
                card.onclick = function() { filterByAuthor(a.user_id, this); };
                // 使用 DOM API 赋值，避免 XSS
                const nameDiv = document.createElement('div');
                nameDiv.className = 'author-name';
                nameDiv.style.color = color;
                nameDiv.textContent = a.user_name || a.user_id;
                const metaDiv = document.createElement('div');
                metaDiv.className = 'author-meta';
                metaDiv.innerHTML = `<span>${escapeHtml(String(a.total))} 条</span><span>${escapeHtml(a.latest_at_fmt || '')}</span>`;
                const delBtn = document.createElement('button');
                delBtn.className = 'author-del-btn';
                delBtn.title = '删除作者';
                delBtn.textContent = '✕';
                delBtn.onclick = function(e) {
                    e.stopPropagation();
                    confirmDeleteAuthor(a.user_id, a.user_name || a.user_id);
                };
                card.appendChild(nameDiv);
                card.appendChild(metaDiv);
                card.appendChild(delBtn);
                panel.appendChild(card);
            });
        }

        // 按作者过滤
        function filterByAuthor(authorId, el) {
            currentFilter = authorId;
            // 更新 active 状态
            document.querySelectorAll('.author-card').forEach(c => c.classList.remove('active'));
            if (el) el.classList.add('active');

            const titleEl = document.getElementById('postsTitle');
            if (authorId === 'all') {
                titleEl.textContent = '全部动态';
                renderPosts(allPosts);
            } else {
                const filtered = allPosts.filter(p => p.user_id === authorId);
                const name = filtered.length ? filtered[0].user_name : authorId;
                titleEl.textContent = `${name} 的动态`;
                renderPosts(filtered);
            }
        }

        // 加载数据
        async function loadData() {
            try {
                const [postsRes, authorsRes] = await Promise.all([
                    fetch('/api/posts?limit=100'),
                    fetch('/api/authors')
                ]);
                const postsData = await postsRes.json();
                const authorsData = await authorsRes.json();

                allPosts = postsData.posts || [];
                dbAuthors = authorsData.db_authors || [];

                // 构建 user_id -> 统计摘要 的映射
                const summaryMap = {};
                (authorsData.authors || []).forEach(s => { summaryMap[s.user_id] = s; });

                // 以 dbAuthors 为主（完整列表），合并统计信息
                const enrichedAuthors = dbAuthors.map(a => ({
                    user_id: a.user_id,
                    user_name: a.name,
                    total: summaryMap[a.user_id] ? summaryMap[a.user_id].total : 0,
                    latest_at_fmt: summaryMap[a.user_id] ? summaryMap[a.user_id].latest_at_fmt : '',
                }));
                renderAuthors(enrichedAuthors);
                filterByAuthor(currentFilter, document.querySelector(`[data-author="${currentFilter}"]`));

                // 更新时间
                if (postsData.last_fetch) {
                    document.getElementById('lastUpdate').textContent = `最近更新: ${postsData.last_fetch.replace('T', ' ').substring(0, 19)}`;
                }
            } catch (e) {
                console.error('加载失败:', e);
            }
        }

        // 手动刷新
        async function refreshData() {
            const btn = document.getElementById('btnRefresh');
            const overlay = document.getElementById('loadingOverlay');
            btn.classList.add('loading');
            btn.disabled = true;
            overlay.classList.add('show');

            try {
                const res = await fetch('/api/refresh', { method: 'POST' });
                const data = await res.json();

                if (data.status === 'ok') {
                    showToast(`✅ 抓取完成！获取 ${data.total_fetched} 条，新增 ${data.new_posts} 条`, 'success');
                    await loadData();
                } else if (data.status === 'skipped') {
                    showToast('⏳ 上一次抓取尚未完成', 'error');
                } else {
                    showToast(`❌ ${data.message || '抓取失败'}`, 'error');
                }
            } catch (e) {
                showToast('❌ 网络错误', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
                overlay.classList.remove('show');
            }
        }

        // Toast 提示
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ===== 作者管理弹窗 =====
        function openAuthorModal() {
            renderModalAuthors();
            document.getElementById('authorModal').classList.add('show');
        }

        function closeAuthorModal() {
            document.getElementById('authorModal').classList.remove('show');
            document.getElementById('newAuthorId').value = '';
            document.getElementById('newAuthorName').value = '';
        }

        function renderModalAuthors() {
            const list = document.getElementById('modalAuthorList');
            if (!dbAuthors.length) {
                list.innerHTML = '<div class="modal-empty">暂无作者，请添加</div>';
                return;
            }
            list.innerHTML = dbAuthors.map(a => `
                <div class="modal-author-item">
                    <div class="modal-author-info">
                        <span class="modal-author-name">${escapeHtml(a.name || a.user_id)}</span>
                        <span class="modal-author-id">${escapeHtml(a.user_id)}</span>
                    </div>
                    <button class="btn-icon-danger" onclick="deleteAuthor('${escapeHtml(a.user_id)}')" title="删除">✕</button>
                </div>`).join('');
        }

        async function addAuthor() {
            const userId = document.getElementById('newAuthorId').value.trim();
            const name = document.getElementById('newAuthorName').value.trim();
            if (!userId || !name) {
                showToast('❌ user_id 和昵称都不能为空', 'error');
                return;
            }
            const res = await fetch('/api/authors', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, name}),
            });
            const data = await res.json();
            if (data.status === 'ok') {
                showToast(`✅ 已添加 ${name}`, 'success');
                await loadData();
                renderModalAuthors();
                document.getElementById('newAuthorId').value = '';
                document.getElementById('newAuthorName').value = '';
                // 自动刷新获取新作者动态
                showToast('📡 正在抓取新作者动态...', 'success');
                await refreshData();
            } else {
                showToast(`❌ ${data.message}`, 'error');
            }
        }

        async function deleteAuthor(userId) {
            if (!confirm('确定删除该作者？')) return;
            await fetch(`/api/authors/${userId}`, {method: 'DELETE'});
            showToast('✅ 已删除', 'success');
            await loadData();
            renderModalAuthors();
        }

        function confirmDeleteAuthor(userId, name) {
            if (!confirm(`确定删除「${name}」？删除后该作者的历史帖子仍会保留。`)) return;
            deleteAuthor(userId);
        }

        // 初始化
        loadData();
        // 每 5 分钟自动刷新前端数据
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
